name = "qsession-live"
main = "hls-worker.js"
compatibility_date = "2026-09-23"
workers_dev = true

[[r2_buckets]]
binding = "QSESSION_LIVE"
bucket_name = "qsession-live"
preview_bucket_name = "qsession-live-preview"

# Producción puede usar inicialmente la dirección workers.dev que entrega
# Wrangler. live.qsession.org se conectará después de incorporar el dominio a
# Cloudflare sin interrumpir el DNS actual de Q Session.
