name: qsession-encoder

services:
  output-init:
    image: alpine:3.22
    restart: 'no'
    command: ['sh', '-c', 'chown 1001:0 /out/edge-live && chmod 2775 /out/edge-live']
    volumes:
      - edge-live:/out/edge-live

  egress:
    image: livekit/egress:v1.14.1
    restart: unless-stopped
    network_mode: host
    depends_on:
      output-init:
        condition: service_completed_successfully
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./private/egress.yaml:/etc/egress.yaml:ro
      - edge-live:/out/edge-live
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    cpus: 4
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

volumes:
  edge-live:
