pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    def generatedConfig = file("../autolinking.json")
    if (generatedConfig.exists()) {
        ex.autolinkLibrariesFromConfigFile(generatedConfig)
    } else {
        def nodeBinary = System.getenv("NODE_BINARY") ?: "node"
        def cli = file("../node_modules/@react-native-community/cli/build/bin.js").absolutePath
        ex.autolinkLibrariesFromCommand([nodeBinary, cli, "config"])
    }
}
rootProject.name = 'QSession'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
